<!DOCTYPE html>
<html>
<head>
    <title>SQL Injection Challenge</title>
</head>
<body>
    <!-- SAFE TO CUSTOMIZE: You can change all the HTML/CSS here. -->
    <h1>Product Search</h1>
    <p>Search our database for the latest gadgets!</p>
    
    <!-- CAREFUL: If you change the input name='query', update app.py to match. -->
    <form method="POST" action="/">
        <input type="text" name="query" value="{{ query }}" placeholder="Search products...">
        <button type="submit">Search</button>
    </form>

    {% if error %}
        <p style="color: red;">Database Error: {{ error }}</p>
    {% endif %}

    {% if results %}
        <h2>Search Results:</h2>
        <ul>
            {% for row in results %}
                <!-- VULNERABILITY: The output displays columns fetched from the database, allowing data extraction. -->
                <li><strong>{{ row[0] }}</strong> - {{ row[1] }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
