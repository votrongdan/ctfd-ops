<!DOCTYPE html>
<html>
<head>
    <title>Uptime Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #f8fafc; }
        .monitor { background: #1e293b; padding: 3rem; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; border: 1px solid #334155; }
        h1 { margin-top: 0; color: #38bdf8; font-weight: 600; letter-spacing: -0.5px; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input[type="text"] { width: 100%; padding: 15px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { background: #0ea5e9; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        .error { color: #f87171; background: rgba(248,113,113,0.1); padding: 15px; border-radius: 8px; margin-top: 1.5rem; text-align: left; }
        .result-box { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #475569; margin-top: 1.5rem; text-align: left; overflow-x: auto; }
        pre { font-family: 'Courier Prime', monospace; color: #10b981; margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="monitor">
        <h1>Uptime Monitor</h1>
        <p>Check the availability of your servers by entering their URL below. We will send an HTTP request and show you the response.</p>
        <form method="POST" action="/">
            <input type="text" name="url" placeholder="http://api.yourdomain.com/health" required>
            <button type="submit">Ping Server</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% if result %}
            <div class="result-box">
                <pre>{{ result }}</pre>
            </div>
        {% endif %}
    </div>
</body>
</html>
