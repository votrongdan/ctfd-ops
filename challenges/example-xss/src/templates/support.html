<!DOCTYPE html>
<html>
<head>
    <title>Contact Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #2b2b2b; color: #f1f1f1; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #3c3f41; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }
        h1 { margin-top: 0; color: #ffab00; font-weight: 500; }
        p { color: #bbb; }
        .msg { background: #2b2b2b; border-left: 4px solid #ffab00; padding: 10px; margin: 1rem 0; text-align: left; color: #fff; }
        form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
        label { color: #bbb; font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #555; background: #2b2b2b; color: white; border-radius: 4px; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #ffab00; outline: none; }
        button { background: #ffab00; color: #2b2b2b; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        a { color: #ffab00; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-top: 1.5rem; transition: color 0.2s; }
        a:hover { color: #ffd166; }
    </style>
</head>
<body>
    <div class="card">
    <h1>Escalate Ticket</h1>
    
    {% if msg %}
        <div class="msg">{{ msg }}</div>
    {% endif %}

    <form method="POST" action="/support">
        <label>Share your ticket link with staff:</label>
        <input type="text" name="url" placeholder="http://..." required size="50">
        <button type="submit">Send to Staff</button>
    </form>
    <br>
    <a href="/">Back</a>
    </div>
</body>
</html>
