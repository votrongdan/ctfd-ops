name: "Direct TCP Overflow"
author: "Antigravity"
attribution: "Antigravity"
category: "Pwn"
description: |
  Welcome to introductory binary exploitation over raw TCP!

  **Objective:**
  Connect to the service using Netcat (`nc <host> <port>`). The remote service allocates a 64-byte stack buffer followed by a target integer variable.
  Your goal is to overflow the 64-byte buffer and overwrite the target register with `0xcafebabe`.

value: 500
type: dynamic_docker

extra:
  initial: 500
  decay: 100
  minimum: 50
  docker_image: pwn_tcp_overflow-challenge:latest
  redirect_type: direct
  redirect_port: 1337

image: .

files:
  - src/chall.c

tags:
