<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2SSH Gateway</title>
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-card: rgba(22, 27, 38, 0.75);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --code-bg: #0f172a;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.08) 0%, transparent 45%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--border-glow);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--accent-cyan);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p.welcome {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        p.clue-hint {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .code-box {
            background: var(--code-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .code-box span.prompt {
            color: var(--text-secondary);
            user-select: none;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        .endpoint-link {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .endpoint-link:hover {
            color: var(--accent-cyan);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 
      ===============================================================
      [SSH CREDENTIALS CLUE FOR BEGINNERS]
      Username: ctf
      Password: web2ssh_access_2026
      
      Instructions: Connect via SSH on port 22 inside this container.
      ===============================================================
    -->
    <div class="container">
        <div class="badge">Per-User Isolated Instance</div>
        <h1>Web2SSH Gateway</h1>
        <p class="welcome">Welcome to Web2SSH.</p>
        <p class="clue-hint">
            The web server knows how to identify the account you need. Check the source / endpoint.
        </p>

        <div class="code-box">
            <div>
                <span class="prompt">$ </span>
                <span>ssh ctf@&lt;challenge_host&gt; -p &lt;ssh_port&gt;</span>
            </div>
            <div class="status-pill">
                <div class="dot"></div>
                <span>SSH Port 22 Active</span>
            </div>
        </div>

        <p class="footer-note">
            Need a structured hint? Inspect page source or query the <a href="/api/status" class="endpoint-link">/api/status</a> endpoint.
        </p>
    </div>
</body>
</html>
