<!DOCTYPE html>
<html>
<head>
    <title>Signature Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fafafa; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .container { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        h1 { margin-top: 0; color: #4a4e69; font-weight: 500; }
        p { color: #8d99ae; margin-bottom: 2rem; }
        form { display: flex; flex-direction: column; gap: 1.5rem; }
        textarea { width: 100%; padding: 15px; border: 1px solid #c9ada7; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 1rem; resize: vertical; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: #9a8c98; box-shadow: 0 0 0 3px rgba(154, 140, 152, 0.2); }
        button { background: #4a4e69; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: background 0.3s, transform 0.1s; }
        button:hover { background: #22223b; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
    <h1>Corporate Signature Generator</h1>
    <p>Preview your signature before adding it to your email client.</p>
    
    <form method="POST" action="/">
        <textarea name="signature_text" rows="4" cols="50" placeholder="Best regards, ..."></textarea><br><br>
        <button type="submit">Preview</button>
    </form>
    </div>
</body>
</html>
