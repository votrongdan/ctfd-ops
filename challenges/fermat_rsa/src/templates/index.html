<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close Proximity - Cryptography Challenge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #58a6ff;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 28px;
        }
        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .download-btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid rgba(240, 246, 252, 0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .download-btn:hover {
            background-color: #2ea44f;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Close Proximity</h1>
        <p>
            We have captured an encrypted transmission and its public parameters. 
            Download the challenge files, factor the public modulus offline, and recover the flag!
        </p>
        <a href="/download" class="download-btn">Download challenge.zip</a>
    </div>
</body>
</html>
