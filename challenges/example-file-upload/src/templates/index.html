<!DOCTYPE html>
<html>
<head>
    <title>Careers</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #e0e5ec; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #4a4a4a; }
        .neumorphic { background: #e0e5ec; padding: 3rem; border-radius: 20px; box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5); width: 100%; max-width: 500px; text-align: center; }
        h1 { margin-top: 0; color: #323232; font-weight: 600; font-size: 1.8rem; }
        p { color: #6b6b6b; margin-bottom: 2rem; }
        .msg { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 15px; border-radius: 10px; margin-bottom: 1.5rem; text-align: left; }
        form { display: flex; flex-direction: column; gap: 1.5rem; }
        input[type="file"] { padding: 15px; background: #e0e5ec; border-radius: 10px; box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.5), inset -6px -6px 10px 0 rgba(255,255,255, 0.5); outline: none; border: none; }
        input[type="file"]::file-selector-button { background: #4a4a4a; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: background 0.3s; margin-right: 10px; }
        input[type="file"]::file-selector-button:hover { background: #323232; }
        button { background: #e0e5ec; color: #4a4a4a; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: 600; box-shadow: 6px 6px 10px 0 rgba(163,177,198, 0.5), -6px -6px 10px 0 rgba(255,255,255, 0.5); transition: box-shadow 0.2s; }
        button:active { box-shadow: inset 4px 4px 6px 0 rgba(163,177,198, 0.5), inset -4px -4px 6px 0 rgba(255,255,255, 0.5); }
    </style>
</head>
<body>
    <div class="neumorphic">
    <h1>Job Application</h1>
    <p>Please upload your resume to apply for the position.</p>
    
    {% if msg %}
        <div class="msg">{{ msg }}</div>
    {% endif %}

    <!-- Notice the input name is changed to 'resume' -->
    <form method="POST" action="/" enctype="multipart/form-data">
        <input type="file" name="resume">
        <button type="submit">Submit Application</button>
    </form>
    </div>
</body>
</html>
