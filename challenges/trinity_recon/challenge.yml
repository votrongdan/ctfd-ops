name: "Trinity Recon"
author: "Antigravity"
category: "Web"
description: |
  Welcome to **Trinity Recon**!

  This challenge exposes 3 distinct services. To solve it, you must navigate through all of them:
  
  - **Web Service (HTTP):** Click the Website Link to get started.
  - **FTP Service (Port 2121):** An anonymous FTP server. Connect using `ftp <host> <ftp_port>` (use `anonymous` with no password).
  - **SSH Service (Port 22):** The final target. Connect using `ssh <user>@<host> -p <ssh_port>`.

  **Intended Solve Path:**
  1. Check the web service for your first clue.
  2. Use the clue to connect to the FTP server and download the backup credentials.
  3. Use the credentials to SSH into the container and read `/home/trinity/flag.txt`.

value: 500
type: dynamic_docker

extra:
  initial: 500
  decay: 100
  minimum: 50
  docker_image: trinity-recon:latest
  redirect_rules: "8080/http,2121/direct,22/direct"

image: .

tags:
  - web
  - ftp
  - ssh
  - beginner
  - multi-port

state: visible
version: "0.1"
