<!DOCTYPE html>
<html>
<head>
    <title>Secure Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .dashboard { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 3rem; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 600px; text-align: center; }
        h1 { margin-top: 0; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        h2 { font-weight: 400; font-size: 1.2rem; color: #dcdde1; margin-bottom: 2rem; }
        ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1rem; }
        li { background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 10px; transition: transform 0.2s, background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        li:hover { transform: translateY(-2px); background: rgba(0,0,0,0.3); }
        a { color: #00d2d3; text-decoration: none; font-weight: 600; font-size: 1.1rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="dashboard">
    <h1>Welcome to Secure Bank</h1>
    <h2>Your Accounts:</h2>
    <ul>
        {% for acc in accounts %}
            <li><a href="/account?no={{ acc[0] }}">Account #{{ acc[0] }}</a> - {{ acc[1] }}</li>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
