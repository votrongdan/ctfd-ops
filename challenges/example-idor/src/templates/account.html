<!DOCTYPE html>
<html>
<head>
    <title>Account Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .dashboard { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 3rem; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 500px; text-align: center; }
        h1 { margin-top: 0; font-weight: 600; color: #00d2d3; margin-bottom: 2rem; }
        .detail-row { background: rgba(0,0,0,0.2); margin-bottom: 1rem; padding: 1.5rem; border-radius: 10px; text-align: left; }
        .detail-row strong { color: #dcdde1; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .detail-row span { font-size: 1.5rem; font-weight: 600; }
        .secret-info { color: #ff6b6b; font-size: 1.1rem !important; }
        a.btn { display: inline-block; margin-top: 2rem; padding: 12px 24px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; text-decoration: none; border-radius: 25px; transition: all 0.2s; }
        a.btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="dashboard">
    <h1>Account Details</h1>
    <div class="detail-row">
        <strong>Balance</strong>
        <span>{{ balance }}</span>
    </div>
    <div class="detail-row">
        <strong>Secret Info</strong>
        <span class="secret-info">{{ secret }}</span>
    </div>
    <a href="/" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
